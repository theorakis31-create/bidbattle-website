<svg xmlns="http://www.w3.org/2000/svg" width="811" height="469" viewBox="0 0 811 469">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#6558a0"/><stop offset=".25" stop-color="#34305b"/><stop offset=".55" stop-color="#1d2148"/><stop offset="1" stop-color="#10162e"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bdbbff"/><stop offset=".5" stop-color="#6053aa"/><stop offset="1" stop-color="#312b5f"/></linearGradient>
 <radialGradient id="stick"><stop stop-color="#5e578e"/><stop offset=".68" stop-color="#22264c"/><stop offset="1" stop-color="#10132d"/></radialGradient>
 <linearGradient id="dieTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ff"/><stop offset="1" stop-color="#d0baff"/></linearGradient>
 <linearGradient id="dieLeft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5dcff"/><stop offset="1" stop-color="#a58cf2"/></linearGradient>
 <linearGradient id="dieRight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#be9bfa"/><stop offset="1" stop-color="#7655ce"/></linearGradient>
 <filter id="drop"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="0" dy="10" result="bl"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- controller in similar left location but with deliberate physical symmetry and complete controls -->
<g transform="translate(66 125) rotate(-11 90 65)" filter="url(#drop)">
 <path d="M18 54 Q19 23 48 18 L142 18 Q174 22 184 53 L202 117 Q203 140 187 147 Q171 154 153 136 L133 104 L77 104 L52 139 Q34 156 19 143 Q5 134 7 115 Z" fill="url(#shell)" stroke="url(#rim)" stroke-width="4" stroke-linejoin="round"/>
 <path d="M41 20 Q48 8 64 11 H85 L92 26 H38 Z M115 26 L125 11 H144 Q161 12 172 22 L174 29 Z" fill="#4d4885" stroke="#b0a9ed" stroke-width="2"/>
 <path d="M50 33 Q89 18 143 33" fill="none" stroke="#8374da" stroke-width="2" opacity=".8"/>
 <rect x="85" y="31" width="24" height="16" rx="5" fill="#555184" stroke="#9e91d5" stroke-width="1.5"/>
 <!-- Accurate D-pad cross; center left -->
 <path d="M38 45 h11 v-10 h10 v10 h11 v10 H59 v12 H49 V55 H38 Z" fill="#a3dbff" stroke="#1d4f94" stroke-width="3" stroke-linejoin="round"/>
 <rect x="51" y="48" width="6" height="6" rx="1" fill="#2b5ea7"/>
 <!-- Four independent right face buttons arranged as a diamond -->
 <circle cx="143" cy="39" r="9" fill="#242b56" stroke="#b6b1ed" stroke-width="2"/><circle cx="143" cy="39" r="4.7" fill="#b98bfc"/>
 <circle cx="160" cy="55" r="9" fill="#242b56" stroke="#b6b1ed" stroke-width="2"/><circle cx="160" cy="55" r="4.7" fill="#86dff7"/>
 <circle cx="143" cy="72" r="9" fill="#242b56" stroke="#b6b1ed" stroke-width="2"/><circle cx="143" cy="72" r="4.7" fill="#ffaecc"/>
 <circle cx="126" cy="55" r="9" fill="#242b56" stroke="#b6b1ed" stroke-width="2"/><circle cx="126" cy="55" r="4.7" fill="#f7db7a"/>
 <!-- Two clearly separated analog sticks -->
 <circle cx="69" cy="88" r="19" fill="#11152f" stroke="#8279b9" stroke-width="4"/><circle cx="69" cy="88" r="13" fill="url(#stick)" stroke="#aaa5ef" stroke-width="1.5"/>
 <circle cx="123" cy="93" r="19" fill="#11152f" stroke="#8279b9" stroke-width="4"/><circle cx="123" cy="93" r="13" fill="url(#stick)" stroke="#aaa5ef" stroke-width="1.5"/>
 <!-- start/select and home - three distinct buttons -->
 <rect x="89" y="65" width="6" height="4" rx="2" fill="#c2c4ef"/>
 <rect x="105" y="65" width="6" height="4" rx="2" fill="#c2c4ef"/>
 <circle cx="100" cy="81" r="5" fill="#393e82" stroke="#d4c8ff" stroke-width="1"/><path d="M98 81 h4" stroke="#d4c8ff"/>
 <path d="M16 115 Q19 137 36 133" fill="none" stroke="#8277b3" stroke-width="3" opacity=".7"/>
 <path d="M170 129 Q186 137 189 114" fill="none" stroke="#8277b3" stroke-width="3" opacity=".7"/>
</g>
<!-- precise purple die: top has ONE, left TWO, right THREE. Opposite pairs 1–6, 2–5, 3–4. -->
<g filter="url(#drop)" transform="translate(0 0)">
 <path d="M513 269 Q512 261 520 255 L557 237 Q563 234 571 238 L611 259 Q619 263 619 272 L619 322 Q618 331 611 336 L577 358 Q570 362 562 358 L518 338 Q512 335 512 326 Z" fill="#bb93f7" stroke="#f7ecff" stroke-width="3"/>
 <path d="M514 268 L562 290 Q570 294 571 303 L570 358 L519 338 Q512 335 512 326 Z" fill="url(#dieLeft)" stroke="#e9d4ff" stroke-width="2"/>
 <path d="M571 303 Q571 294 578 290 L617 267 L619 321 Q618 330 611 336 L570 358 Z" fill="url(#dieRight)" stroke="#ead7ff" stroke-width="2"/>
 <path d="M514 268 L554 241 Q560 236 568 240 L617 266 L575 294 Q569 298 562 292 Z" fill="url(#dieTop)" stroke="#fff5ff" stroke-width="2"/>
 <ellipse cx="563" cy="266" rx="7" ry="5" fill="#6530ad" transform="rotate(-10 563 266)"/>
 <ellipse cx="529" cy="290" rx="5.3" ry="7" fill="#62339f" transform="rotate(-22 529 290)"/>
 <ellipse cx="549" cy="332" rx="5.3" ry="7" fill="#62339f" transform="rotate(-22 549 332)"/>
 <ellipse cx="590" cy="302" rx="6.1" ry="4.3" fill="#4d248b" transform="rotate(-28 590 302)"/>
 <ellipse cx="601" cy="318" rx="6.1" ry="4.3" fill="#4d248b" transform="rotate(-28 601 318)"/>
 <ellipse cx="582" cy="334" rx="6.1" ry="4.3" fill="#4d248b" transform="rotate(-28 582 334)"/>
</g>
</svg>