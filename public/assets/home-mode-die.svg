<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160" role="img" aria-label="Lila Spielwürfel mit 1, 2 und 3 Augen auf den sichtbaren Seiten">
<defs>
<linearGradient id="top" x1="0" x2="1" y2="1"><stop stop-color="#fffaff"/><stop offset="1" stop-color="#e0caff"/></linearGradient>
<linearGradient id="left" x1="0" x2="0.8" y2="1"><stop stop-color="#eee1ff"/><stop offset="1" stop-color="#ae8bf4"/></linearGradient>
<linearGradient id="right" x1="0" x2="1" y2="1"><stop stop-color="#b48af1"/><stop offset="1" stop-color="#7548cd"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#5635a6" flood-opacity=".25"/></filter>
</defs>
<g filter="url(#shadow)" stroke="#fff5ff" stroke-width="2" stroke-linejoin="round">
<path fill="url(#top)" d="M90 13 156 47 90 81 24 47Z"/>
<path fill="url(#left)" d="M24 47 90 81 90 151 24 117Z"/>
<path fill="url(#right)" d="M90 81 156 47 156 117 90 151Z"/>
</g>
<!-- Top face: exactly one pip -->
<ellipse cx="90" cy="47" rx="9" ry="6" fill="#6034ac"/>
<!-- Left face: exactly two pips -->
<ellipse cx="46" cy="72" rx="7" ry="9" fill="#683db8" transform="rotate(-21 46 72)"/>
<ellipse cx="70" cy="119" rx="7" ry="9" fill="#683db8" transform="rotate(-21 70 119)"/>
<!-- Right face: exactly three pips -->
<ellipse cx="127" cy="70" rx="7" ry="9" fill="#51258c" transform="rotate(21 127 70)"/>
<ellipse cx="114" cy="100" rx="7" ry="9" fill="#51258c" transform="rotate(21 114 100)"/>
<ellipse cx="139" cy="111" rx="7" ry="9" fill="#51258c" transform="rotate(21 139 111)"/>
</svg>